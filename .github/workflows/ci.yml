name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U testuser -d testdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt

      - name: Run tests
        env:
          db_host: 127.0.0.1
          db_port: '5432'
          db_user: testuser
          db_pwd: testpass
          db_name: testdb
        run: python -m pytest -q -rs --junitxml=pytest-report.xml

      - name: Fail if tests were skipped
        if: always()
        run: |
            python -c "import os, sys, xml.etree.ElementTree as ET; p='pytest-report.xml'; r=ET.parse(p).getroot() if os.path.exists(p) else None; s=sum(1 for t in r.iter('testcase') if t.find('skipped') is not None) if r is not None else -1; print(f'Skipped tests: {s}'); sys.exit(1 if s != 0 else 0)"